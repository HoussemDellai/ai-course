apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-31b-it-a100
  namespace: default
  labels:
    app: gemma-4-31b-it-a100
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-4-31b-it-a100
  template:
    metadata:
      labels:
        app: gemma-4-31b-it-a100
    spec:
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        apps: llm
      containers:
        - name: gemma4-cu130
          image: vllm/vllm-openai:gemma4-cu130
          args:
            - "--model"
            - "google/gemma-4-31B-it"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "8736"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--limit-mm-per-prompt"
            - '{"images": 4, "videos": 1, "audios": 1}'
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "gemma4"
            - "--reasoning-parser"
            - "gemma4"
            - "--chat-template"
            - "examples/tool_chat_template_gemma4.jinja"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "24"
              memory: "220Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-31b-it-a100
  namespace: default
  labels:
    app: gemma-4-31b-it-a100
spec:
  type: LoadBalancer
  selector:
    app: gemma-4-31b-it-a100
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

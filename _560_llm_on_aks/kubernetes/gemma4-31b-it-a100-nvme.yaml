apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-31b-it-a100-nvme
  namespace: default
  labels:
    app: gemma-4-31b-it-a100-nvme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-4-31b-it-a100-nvme
  template:
    metadata:
      labels:
        app: gemma-4-31b-it-a100-nvme
    spec:
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        apps: phi-4
      initContainers:
        - name: init-nvme
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Preparing local NVMe disk for model cache..."
              mkdir -p /nvme/cache
              chmod 777 /nvme/cache
          volumeMounts:
            - name: local-nvme
              mountPath: /nvme
      containers:
        - name: gemma4-cu130
          image: vllm/vllm-openai:gemma4-cu130
          args:
            - "--model"
            - "google/gemma-4-31B-it"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "8736"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--limit-mm-per-prompt"
            - '{"images": 4, "videos": 1, "audios": 1}'
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "gemma4"
            - "--reasoning-parser"
            - "gemma4"
            - "--chat-template"
            - "examples/tool_chat_template_gemma4.jinja"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: VLLM_CACHE_ROOT
              value: "/root/.cache/vllm"
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            - name: HF_HUB_CACHE
              value: "/root/.cache/huggingface/hub"
            - name: HF_ASSETS_CACHE
              value: "/root/.cache/huggingface/assets"
            - name: HF_HUB_VERBOSITY
              value: "warning"
          volumeMounts:
            - name: local-nvme
              mountPath: /root/.cache/
              subPath: cache
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "200Gi"
            limits:
              cpu: "24"
              memory: "220Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "400Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: local-nvme
          hostPath:
            path: /mnt
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-31b-it-a100-nvme
  namespace: default
  labels:
    app: gemma-4-31b-it-a100-nvme
spec:
  type: LoadBalancer
  selector:
    app: gemma-4-31b-it-a100-nvme
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

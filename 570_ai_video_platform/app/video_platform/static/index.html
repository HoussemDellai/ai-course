<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI Video Platform</title>
  <style>
    :root {
      --bg: #0d1117; --bg-inset: #010409; --panel: #151b23; --panel-2: #212830; --hover: #656c7633;
      --border: #3d444d; --border-muted: #3d444db3; --fg: #f0f6fc; --muted: #9198a1; --subtle: #656c76;
      --accent: #4493f8; --accent-emph: #1f6feb; --success: #3fb950; --success-emph: #238636; --danger: #f85149;
      --attention: #d29922; --done: #ab7df8; --done-emph: #8957e5;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); display: flex; flex-direction: column; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font: inherit; color: inherit; }
    code, .mono { font-family: var(--mono); font-size: 12px; }
    svg { flex: none; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .grow { flex: 1; }

    /* Top bar */
    .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-inset); border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .brand .logo { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #8957e5, #1f6feb); }
    .crumb { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crumb::before { content: "/"; margin: 0 8px; color: var(--subtle); }
    .crumb:empty { display: none; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #2a313c; border-color: #656c76; text-decoration: none; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary { background: var(--success-emph); border-color: #ffffff1a; color: #fff; }
    .btn-primary:hover { background: #29903b; }
    .btn-block { width: 100%; justify-content: center; }
    .icon-btn { width: 32px; padding: 0; justify-content: center; }

    /* API key popover */
    .key-wrap { position: relative; }
    .popover { position: absolute; right: 0; top: 40px; width: 320px; z-index: 10; padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px #010409cc; }
    .popover label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input { width: 100%; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); outline: none; }
    .input:focus, .composer:focus-within { border-color: var(--accent-emph); box-shadow: 0 0 0 1px var(--accent-emph); }

    /* GPU badge + popover */
    .gpu-wrap { position: relative; }
    .gpu-btn { font-variant-numeric: tabular-nums; }
    .gpu-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--subtle); }
    .gpu-btn.online .dot { background: var(--success); box-shadow: 0 0 0 3px #3fb95033; }
    .gpu-btn .meter { width: 40px; height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; }
    .gpu-btn .meter i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
    .gpu-pop { width: 380px; max-height: calc(100vh - 80px); overflow-y: auto; }
    .gpu-server + .gpu-server { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-muted); }
    .gpu-server-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
    .gpu-card + .gpu-card { margin-top: 12px; }
    .gpu-name { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .gpu-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .gpu-row + .gpu-row { margin-top: 4px; }
    .gpu-bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
    .gpu-bar i { display: block; height: 100%; transition: width .4s; }
    .gpu-bar.util i { background: var(--accent); }
    .gpu-bar.mem i { background: var(--done); }
    .gpu-facts { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .gpu-spark { display: block; width: 100%; height: 44px; margin-top: 8px; background: var(--bg); border-radius: 6px; }
    .gpu-legend { display: flex; gap: 12px; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .gpu-legend span::before { content: ""; display: inline-block; width: 8px; height: 2px; margin-right: 4px; vertical-align: middle; background: var(--c); }

    /* Layout */
    .layout { flex: 1; display: flex; min-height: 0; }
    .sidebar { width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; padding: 16px 8px 16px 16px; border-right: 1px solid var(--border); background: var(--bg); overflow-y: auto; }
    .side-title { margin: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
    main { flex: 1; overflow-y: auto; min-width: 0; }

    /* Session list */
    .job-list { display: flex; flex-direction: column; gap: 2px; }
    .job-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 6px; color: var(--fg); position: relative; }
    .job-item:hover { background: var(--hover); text-decoration: none; }
    .job-item.active { background: var(--hover); }
    .job-item.active::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent); }
    .job-item .icon { margin-top: 2px; }
    .ji-main { min-width: 0; display: flex; flex-direction: column; }
    .ji-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ji-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { padding: 8px; color: var(--muted); }

    /* Status icons */
    .icon { width: 16px; height: 16px; display: inline-grid; place-items: center; }
    .c-succeeded, .c-completed { color: var(--success); }
    .c-failed { color: var(--danger); }
    .c-running, .c-active { color: var(--attention); }
    .c-queued, .c-pending, .c-skipped, .c-cancelled { color: var(--subtle); }
    .c-reused { color: var(--done); }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Composer view */
    .compose-view { max-width: 768px; margin: 0 auto; padding: 12vh 24px 48px; }
    .hero { text-align: center; margin-bottom: 24px; }
    .hero .logo { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #8957e5, #1f6feb); }
    .hero h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .composer { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 12px; }
    .composer textarea { width: 100%; min-height: 96px; max-height: 320px; resize: none; border: 0; outline: none; background: transparent; line-height: 1.5; }
    .composer textarea::placeholder { color: var(--subtle); }
    .composer-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 12px; cursor: pointer; }
    .pill:hover { color: var(--fg); }
    .pill select, .pill input { border: 0; background: transparent; outline: none; color: var(--fg); font-size: 12px; }
    .pill select option { background: var(--panel); }
    .pill input[type=number] { width: 48px; }
    .pill input[type=checkbox] { accent-color: var(--accent-emph); margin: 0; }
    .send { width: 32px; height: 32px; border-radius: 6px; border: 0; display: grid; place-items: center; background: var(--fg); color: var(--bg); cursor: pointer; }
    .send:disabled { opacity: .4; cursor: default; }
    .hint { margin: 10px 4px 0; }

    /* Session view */
    .session { max-width: 900px; margin: 0 auto; padding: 24px 24px 64px; }
    .job-head h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    .job-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 12px; }
    .label { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid; border-radius: 2em; font-size: 12px; font-weight: 500; line-height: 20px; }
    .label.completed { color: var(--success); border-color: #238636; }
    .label.failed { color: var(--danger); border-color: #da3633; }
    .label.active { color: var(--attention); border-color: #9e6a03; }
    .label.queued { color: var(--muted); border-color: var(--border); }
    .thread { margin-top: 24px; display: flex; flex-direction: column; gap: 24px; }
    .msg { display: flex; gap: 12px; }
    .avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .avatar.user { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
    .avatar.agent { background: linear-gradient(135deg, #8957e5, #1f6feb); }
    .msg-col { flex: 1; min-width: 0; }
    .msg-title { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 10px; }
    .bubble { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { display: inline-flex; gap: 6px; align-items: center; padding: 0 8px; border-radius: 2em; background: var(--panel-2); border: 1px solid var(--border-muted); font-size: 12px; line-height: 20px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .k { color: var(--muted); }

    /* Operations timeline */
    .timeline { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); overflow: hidden; }
    .timeline > .op + .op { border-top: 1px solid var(--border-muted); }
    .op-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; cursor: pointer; user-select: none; }
    .op-row:hover { background: var(--hover); }
    .op-row:focus-visible { outline: 2px solid var(--accent-emph); outline-offset: -2px; }
    .op-row.static { cursor: default; }
    .op-row.static:hover { background: transparent; }
    .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .12s; }
    .open > .op-row .chev { transform: rotate(90deg); }
    .chev.none { visibility: hidden; }
    .op-title { font-weight: 600; white-space: nowrap; }
    .op-summary { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .tool { flex: none; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border-muted); color: var(--muted); font-size: 11px; line-height: 18px; }
    .dur { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    .count { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .bar { flex: none; width: 96px; height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent-emph); border-radius: 6px; transition: width .3s; }
    .pending > .op-row { cursor: default; }
    .pending > .op-row:hover { background: transparent; }
    .pending .op-title { color: var(--muted); font-weight: 500; }
    .op-body { padding: 0 12px 12px 44px; display: flex; flex-direction: column; gap: 10px; }
    .op-children { border-left: 1px solid var(--border); margin-left: -20px; padding-left: 8px; display: flex; flex-direction: column; }
    .op-children .op-row { min-height: 32px; padding: 4px 8px; border-radius: 6px; }
    .op-children .op-title { font-weight: 500; }
    .op-children .op-body { padding: 0 8px 8px 40px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .detail { padding: 8px 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border-muted); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    .log { margin: 0; padding: 8px 12px; border-radius: 6px; background: var(--bg-inset); border: 1px solid var(--border-muted); font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
    .log .ts { color: var(--subtle); }
    .log .lvl-warning { color: var(--attention); }
    .log .lvl-error, .log .lvl-critical { color: var(--danger); }
    .op-error { padding: 8px 12px; border-radius: 6px; border: 1px solid #f8514966; background: #f851491a; color: #ffa198; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 var(--mono); }
    .run-group { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); margin-bottom: 12px; overflow: hidden; }
    .run-group > .op-row { color: var(--muted); }
    .run-group > .op-body { padding: 0 12px 12px; }
    .run-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }

    /* Outcome */
    .flash { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; margin-top: 12px; border-radius: 12px; border: 1px solid; }
    .flash-error { border-color: #f8514966; background: #f851491a; }
    .flash-error .flash-text { color: #ffa198; font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; }
    .player { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #000; }
    .player video { display: block; width: 100%; max-height: 70vh; }
    .player-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border); }

    @media (max-width: 768px) {
      .layout { flex-direction: column; overflow-y: auto; }
      .sidebar { width: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px; }
      main { overflow: visible; }
      .op-summary, .bar { display: none; }
      .op-body { padding-left: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" title="New video">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="#fff"><path d="M8 0l1.6 4.8L14.4 6.4 9.6 8 8 12.8 6.4 8 1.6 6.4l4.8-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg></span>
      <span style="color: var(--fg)">AI Video Platform</span>
    </a>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <div class="gpu-wrap" id="gpuWrap" hidden>
      <button class="btn btn-sm gpu-btn" id="gpuBtn" type="button" title="Live GPU utilisation of the ComfyUI VM(s)">
        <span class="dot"></span>
        <span id="gpuText">GPU</span>
        <span class="meter"><i id="gpuMeter" style="width: 0%"></i></span>
      </button>
      <div class="popover gpu-pop" id="gpuPop" hidden></div>
    </div>
    <div class="key-wrap">
      <button class="btn btn-sm" id="keyBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="5" cy="11" r="3"/><path d="M7.2 8.8 14 2M11.5 4.5 13 6M10 6l1.2 1.2"/></svg>
        API key
      </button>
      <div class="popover" id="keyPop" hidden>
        <label for="key">API key</label>
        <input class="input" id="key" type="password" autocomplete="off" placeholder="Paste the platform API key">
        <p class="muted small" style="margin: 8px 0 0">Stored in this browser only and sent as <code>X-API-Key</code>.</p>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <a class="btn btn-block" href="#">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        New video
      </a>
      <div class="side-title">Videos</div>
      <nav class="job-list" id="jobs"></nav>
    </aside>

    <main id="main">
      <section class="compose-view" id="composeView">
        <div class="hero">
          <div class="logo"><svg width="24" height="24" viewBox="0 0 16 16" fill="#fff"><path d="M8 0l1.6 4.8L14.4 6.4 9.6 8 8 12.8 6.4 8 1.6 6.4l4.8-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg></div>
          <h1>What should we film today?</h1>
          <div class="muted">Prompt &rarr; creative brief, storyboard &amp; shot prompts &rarr; ComfyUI clips &rarr; Azure AI Speech narration &rarr; ffmpeg</div>
        </div>
        <form class="composer" id="form">
          <textarea id="prompt" required minlength="3" maxlength="4000" placeholder="Describe your video, e.g. A documentary about a lighthouse keeper's last winter on a remote Breton island"></textarea>
          <div class="composer-bar">
            <label class="pill" title="Video model">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3.5" width="9" height="9" rx="1.5"/><path d="M10.5 7 14.5 4.5v7L10.5 9"/></svg>
              <select id="model" aria-label="Video model"></select>
            </label>
            <label class="pill" title="Duration in minutes">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>
              <input id="duration" type="number" min="0.25" max="10" step="0.25" value="5" aria-label="Duration in minutes"> min
            </label>
            <label class="pill" title="Voice-over narration">
              <input id="narration" type="checkbox" checked> Narration
            </label>
            <span class="grow"></span>
            <button class="send" id="send" type="submit" title="Generate video (Ctrl+Enter)" aria-label="Generate video">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
            </button>
          </div>
        </form>
        <div class="hint muted small" id="license"></div>
      </section>

      <section class="session" id="jobView" hidden>
        <div class="job-head" id="jobHead"></div>
        <div class="thread">
          <div class="msg">
            <div class="avatar user">You</div>
            <div class="msg-col" id="userMsg"></div>
          </div>
          <div class="msg">
            <div class="avatar agent"><svg width="16" height="16" viewBox="0 0 16 16" fill="#fff"><path d="M8 0l1.6 4.8L14.4 6.4 9.6 8 8 12.8 6.4 8 1.6 6.4l4.8-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg></div>
            <div class="msg-col">
              <div class="msg-title" id="agentTitle"></div>
              <div id="timeline"></div>
              <div id="outcome"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const key = () => $("key").value;
    const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-API-Key": key(), ...(opts.headers || {}) } });

    const STEPS = [
      ["enhance_prompt", "Enhance prompt"], ["plan_storyboard", "Plan storyboard"], ["generate_clips", "Generate clips"],
      ["narrate", "Narrate"], ["assemble", "Assemble video"],
    ];
    const STATUS_TEXT = {
      queued: "Queued", enhancing: "Enhancing prompt", planning: "Planning storyboard", generating: "Generating clips",
      narrating: "Narrating", assembling: "Assembling", completed: "Completed", failed: "Failed",
    };
    const AGENT_TEXT = {
      queued: "is waiting for a free worker", enhancing: "is writing the creative brief", planning: "is planning the storyboard",
      generating: "is generating the clips", narrating: "is recording the narration", assembling: "is assembling the video",
      completed: "finished the video", failed: "stopped because of an error",
    };
    const TOOL = { agent: "Agent", clip: "ComfyUI", narration: "Speech", ffmpeg: "ffmpeg", upload: "Storage" };
    const DETAIL_LABEL = { agent: "Result", clip: "Prompt", narration: "Narration" };

    const ICONS = {
      succeeded: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="m4.8 8.2 2.1 2.1 4.3-4.6" fill="none" stroke="#0d1117" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      failed: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="m5.6 5.6 4.8 4.8m0-4.8-4.8 4.8" stroke="#0d1117" stroke-width="1.6" stroke-linecap="round"/></svg>`,
      running: `<svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6" stroke-opacity=".25"/><path d="M8 2a6 6 0 0 1 6 6" stroke-linecap="round"/></svg>`,
      queued: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25" stroke-dasharray="2.6 2.3"/></svg>`,
      pending: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/></svg>`,
      reused: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M5.1 8.3a2.9 2.9 0 1 0 1-2.5M5.2 3.9v2.3h2.3" fill="none" stroke="#0d1117" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      skipped: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="m3.6 12.4 8.8-8.8"/></svg>`,
      cancelled: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><rect x="5.75" y="5.75" width="4.5" height="4.5" rx=".75" fill="currentColor" stroke="none"/></svg>`,
    };
    const CHEVRON = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg>`;
    const icon = (status) => `<span class="icon c-${esc(status)}" title="${esc(status)}">${ICONS[status] || ICONS.pending}</span>`;
    const jobIcon = (s) => s === "completed" ? icon("succeeded") : s === "failed" ? icon("failed") : s === "queued" ? icon("queued") : `<span class="icon c-active">${ICONS.running}</span>`;

    const ACTIVE = new Set(["queued", "running"]);
    const isFinished = (job) => job && (job.status === "completed" || job.status === "failed");

    function fmtDur(sec) {
      sec = Math.max(0, Math.floor(sec));
      if (sec < 60) return `${sec}s`;
      if (sec < 3600) return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, "0")}s`;
      return `${Math.floor(sec / 3600)}h ${String(Math.floor(sec / 60) % 60).padStart(2, "0")}m`;
    }
    function ago(iso) {
      const s = (Date.now() - new Date(iso)) / 1000;
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      if (s < 7 * 86400) return `${Math.floor(s / 86400)}d ago`;
      return new Date(iso).toLocaleDateString();
    }
    const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const seq = (op) => parseInt(op.id.split("-")[1], 10) || 0;
    const byCreation = (a, b) => a.run - b.run || seq(a) - seq(b);

    // ---------------------------------------------------------------- state
    let jobs = [], models = [];
    let cur = null;                 // { id, job, ops: Map }
    let source = null, pollTimer = null, renderQueued = false, outcomeKey = "";
    const toggled = new Map();      // op id / run id -> open, when the user expanded or collapsed it

    // ---------------------------------------------------------------- API key popover
    $("key").value = localStorage.getItem("apiKey") || "";
    $("keyBtn").onclick = (e) => { e.stopPropagation(); $("keyPop").hidden = !$("keyPop").hidden; if (!$("keyPop").hidden) $("key").focus(); };
    document.addEventListener("click", (e) => { if (!e.target.closest(".key-wrap")) $("keyPop").hidden = true; });
    $("key").onchange = () => {
      localStorage.setItem("apiKey", key());
      $("keyPop").hidden = true;
      loadModels(); loadJobs(); startGpu();
      if (cur) { const id = cur.id; cur = null; showJob(id); }
    };

    // ---------------------------------------------------------------- live GPU utilisation
    const GPU_POLL_MS = 2000, GPU_HISTORY = 60;   // 60 samples x 2 s = last 2 minutes
    const gpuHistory = new Map();                 // "server#index" -> [{ u, m }]
    let gpuTimer = null, gpuBusy = false, gpuLast = null;
    const pct = (v) => Math.max(0, Math.min(100, Number(v) || 0));
    const gb = (mib) => mib == null ? "–" : (mib / 1024).toFixed(1);
    const memPct = (g) => g.memory_total_mib ? 100 * (g.memory_used_mib || 0) / g.memory_total_mib : 0;

    function startGpu() {
      clearInterval(gpuTimer);
      gpuTimer = setInterval(pollGpu, GPU_POLL_MS);
      pollGpu();
    }
    function stopGpu() { clearInterval(gpuTimer); gpuTimer = null; $("gpuWrap").hidden = true; $("gpuPop").hidden = true; }
    async function pollGpu() {
      if (gpuBusy || document.hidden) return;
      gpuBusy = true;
      try {
        const r = await api("/api/gpu");
        if (!r.ok) { stopGpu(); return; }     // 401: restarted when the API key changes
        const data = await r.json();
        if (!data.enabled) { stopGpu(); return; }
        gpuLast = data;
        for (const s of data.servers) for (const g of s.gpus) {
          const k = `${s.name}#${g.index}`;
          const h = gpuHistory.get(k) || [];
          h.push({ u: pct(g.utilization_gpu), m: pct(memPct(g)) });
          if (h.length > GPU_HISTORY) h.shift();
          gpuHistory.set(k, h);
        }
        renderGpu();
      } catch { /* network blip: keep the last values */ } finally { gpuBusy = false; }
    }
    function renderGpu() {
      const servers = gpuLast?.servers || [];
      const gpus = servers.flatMap(s => s.gpus);
      const online = servers.some(s => s.online);
      $("gpuWrap").hidden = false;
      $("gpuBtn").classList.toggle("online", online);
      if (online && gpus.length) {
        const util = gpus.reduce((a, g) => a + pct(g.utilization_gpu), 0) / gpus.length;
        const used = gpus.reduce((a, g) => a + (g.memory_used_mib || 0), 0);
        const total = gpus.reduce((a, g) => a + (g.memory_total_mib || 0), 0);
        $("gpuText").textContent = `GPU ${Math.round(util)}% · ${gb(used)}/${gb(total)} GB`;
        $("gpuMeter").style.width = `${util}%`;
      } else {
        $("gpuText").textContent = "GPU offline";
        $("gpuMeter").style.width = "0%";
      }
      if (!$("gpuPop").hidden) renderGpuPop();
    }
    function spark(points) {
      const W = 340, H = 44, n = GPU_HISTORY - 1;
      const line = (f) => points.map((p, i) => `${((GPU_HISTORY - points.length + i) * W / n).toFixed(1)},${(H - 2 - f(p) * (H - 4) / 100).toFixed(1)}`).join(" ");
      return `<svg class="gpu-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <polyline points="${line(p => p.m)}" fill="none" stroke="var(--done)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <polyline points="${line(p => p.u)}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>`;
    }
    function renderGpuPop() {
      const servers = gpuLast?.servers || [];
      $("gpuPop").innerHTML = servers.map(s => `
        <div class="gpu-server">
          <div class="gpu-server-head">${s.online ? icon("succeeded") : icon("cancelled")}<span>${esc(s.name)}</span></div>
          ${s.online ? "" : `<div class="muted small">Unreachable. The VM may be deallocated.</div>`}
          ${s.gpus.map(g => {
            const u = pct(g.utilization_gpu), m = memPct(g);
            const power = g.power_draw_w == null ? "–" : `${Math.round(g.power_draw_w)}${g.power_limit_w ? ` / ${Math.round(g.power_limit_w)}` : ""} W`;
            return `<div class="gpu-card">
              <div class="gpu-name">GPU ${esc(g.index)} · ${esc(g.name)}</div>
              <div class="gpu-row"><span class="muted">Util</span><div class="gpu-bar util"><i style="width:${u}%"></i></div><span>${Math.round(u)}%</span></div>
              <div class="gpu-row"><span class="muted">VRAM</span><div class="gpu-bar mem"><i style="width:${m}%"></i></div><span>${gb(g.memory_used_mib)} / ${gb(g.memory_total_mib)} GB</span></div>
              <div class="gpu-facts"><span>${g.temperature_c == null ? "–" : `${Math.round(g.temperature_c)} °C`}</span><span>${power}</span></div>
              ${spark(gpuHistory.get(`${s.name}#${g.index}`) || [])}
              <div class="gpu-legend"><span style="--c: var(--accent)">Util</span><span style="--c: var(--done)">VRAM</span><i class="grow"></i><small>last 2 min</small></div>
            </div>`;
          }).join("")}
        </div>`).join("") || `<div class="muted">No GPU server configured.</div>`;
    }
    $("gpuBtn").onclick = (e) => { e.stopPropagation(); $("gpuPop").hidden = !$("gpuPop").hidden; if (!$("gpuPop").hidden) renderGpuPop(); };
    document.addEventListener("click", (e) => { if (!e.target.closest(".gpu-wrap")) $("gpuPop").hidden = true; });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && gpuTimer) pollGpu(); });

    // ---------------------------------------------------------------- composer
    async function loadModels() {
      const r = await api("/api/models");
      if (!r.ok) return;
      models = await r.json();
      $("model").innerHTML = models.map(m => `<option value="${esc(m.key)}" ${m.default ? "selected" : ""}>${esc(m.name)}</option>`).join("");
      showLicense();
    }
    function showLicense() {
      const m = models.find(m => m.key === $("model").value);
      $("license").textContent = m ? `${m.resolution} · ${m.clip_seconds}s clips${m.native_audio ? " · native audio" : ""} · License: ${m.license}` : "";
    }
    $("model").onchange = showLicense;
    $("prompt").oninput = () => { const t = $("prompt"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
    $("prompt").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit(); };
    $("form").onsubmit = async (e) => {
      e.preventDefault();
      $("send").disabled = true;
      try {
        const body = { prompt: $("prompt").value, duration_minutes: parseFloat($("duration").value), video_model: $("model").value || null, narration: $("narration").checked };
        const r = await api("/api/videos", { method: "POST", body: JSON.stringify(body) });
        if (r.status === 401) { $("keyPop").hidden = false; return; }
        if (!r.ok) { alert(await r.text()); return; }
        const job = await r.json();
        $("prompt").value = ""; $("prompt").style.height = "";
        jobs = [job, ...jobs.filter(j => j.id !== job.id)];
        location.hash = job.id;
        loadJobs();
      } finally { $("send").disabled = false; }
    };

    // ---------------------------------------------------------------- sidebar
    async function loadJobs() {
      const r = await api("/api/videos");
      if (r.status === 401) {
        $("jobs").innerHTML = `<div class="empty">Enter the API key to see your videos.</div>`;
        $("keyPop").hidden = false;
        return;
      }
      if (!r.ok) return;
      jobs = await r.json();
      if (cur) {
        const fresh = jobs.find(j => j.id === cur.id);
        if (fresh && (!cur.job || new Date(fresh.updated_at) >= new Date(cur.job.updated_at))) { cur.job = fresh; scheduleRender(); }
      }
      renderSidebar();
    }
    function renderSidebar() {
      $("jobs").innerHTML = jobs.map(j => {
        const progress = j.status === "generating" && j.clips_total ? ` · ${j.clips_done}/${j.clips_total} clips` : "";
        return `<a class="job-item ${cur && cur.id === j.id ? "active" : ""}" href="#${esc(j.id)}">
          ${jobIcon(j.status)}
          <span class="ji-main">
            <span class="ji-title">${esc(j.title || j.request.prompt)}</span>
            <span class="ji-meta">${esc(STATUS_TEXT[j.status] || j.status)}${progress} · ${esc(ago(j.created_at))}</span>
          </span>
        </a>`;
      }).join("") || `<div class="empty">No videos yet.</div>`;
    }

    // ---------------------------------------------------------------- routing
    function route() {
      const id = decodeURIComponent(location.hash.slice(1));
      if (id) showJob(id); else showCompose();
    }
    function showCompose() {
      stopWatching(); cur = null;
      $("jobView").hidden = true; $("composeView").hidden = false;
      $("crumb").textContent = ""; document.title = "AI Video Platform";
      renderSidebar();
      $("prompt").focus();
    }
    function showJob(id) {
      if (cur && cur.id === id) return;
      stopWatching();
      cur = { id, job: jobs.find(j => j.id === id) || null, ops: new Map() };
      toggled.clear(); outcomeKey = "";
      $("composeView").hidden = true; $("jobView").hidden = false;
      $("main").scrollTop = 0;
      renderSidebar(); renderJob();
      watch(id);
    }
    window.addEventListener("hashchange", route);

    // ---------------------------------------------------------------- live updates (SSE, polling fallback)
    function stopWatching() {
      if (source) { source.close(); source = null; }
      clearTimeout(pollTimer); pollTimer = null;
    }
    function onState(job) {
      if (!cur || job.id !== cur.id) return;
      cur.job = job;
      const i = jobs.findIndex(j => j.id === job.id);
      if (i >= 0) jobs[i] = job; else jobs.unshift(job);
      renderSidebar(); scheduleRender();
    }
    function onOp(op) { cur.ops.set(op.id, op); scheduleRender(); }
    function watch(id) {
      if (!window.EventSource) return poll(id);
      const es = source = new EventSource(`/api/videos/${encodeURIComponent(id)}/events?key=${encodeURIComponent(key())}`);
      es.addEventListener("state", (e) => onState(JSON.parse(e.data)));
      es.addEventListener("op", (e) => { if (cur && cur.id === id) onOp(JSON.parse(e.data)); });
      es.addEventListener("end", () => { es.close(); if (source === es) source = null; loadJobs(); });
      es.onerror = () => {
        es.close();
        if (source !== es) return;
        source = null;
        poll(id);  // stream unavailable (proxy, auth, network): fall back to polling
      };
    }
    async function poll(id) {
      if (!cur || cur.id !== id) return;
      const enc = encodeURIComponent(id);
      try {
        const [rs, ro] = await Promise.all([api(`/api/videos/${enc}`), api(`/api/videos/${enc}/operations`)]);
        if (rs.status === 401) { $("keyPop").hidden = false; return; }
        if (rs.ok && ro.ok && cur && cur.id === id) {
          onState(await rs.json());
          for (const op of await ro.json()) cur.ops.set(op.id, op);
          scheduleRender();
          if (isFinished(cur.job)) return;
        }
      } catch { /* network hiccup: try again */ }
      if (cur && cur.id === id) pollTimer = setTimeout(() => poll(id), 3000);
    }

    // ---------------------------------------------------------------- session rendering
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      const run = () => {
        // Don't wipe out a text selection (e.g. copying a prompt or a log line) with a live update.
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && $("timeline").contains(sel.anchorNode)) return setTimeout(run, 1000);
        renderQueued = false; renderJob();
      };
      requestAnimationFrame(run);
    }
    function isOpen(op) {
      if (toggled.has(op.id)) return toggled.get(op.id);
      return op.status === "failed" || (op.kind === "step" && op.status === "running");
    }
    function duration(op) {
      if (!op.started_at) return `<span class="dur"></span>`;
      const title = `Started ${time(op.started_at)}${op.ended_at ? ` · ended ${time(op.ended_at)}` : ""}`;
      if (!op.ended_at) return `<span class="dur" data-since="${esc(op.started_at)}" title="${esc(title)}">${fmtDur((Date.now() - new Date(op.started_at)) / 1000)}</span>`;
      return `<span class="dur" title="${esc(title)}">${fmtDur((new Date(op.ended_at) - new Date(op.started_at)) / 1000)}</span>`;
    }
    function attrValue(k, v) {
      if (typeof v === "string") return v.replace(/^https?:\/\//, "");
      return typeof v === "object" ? JSON.stringify(v) : String(v);
    }
    function renderOp(op, children) {
      const kids = (children.get(op.id) || []);
      const attrs = Object.entries(op.attrs).filter(([k, v]) => k !== "step" && v !== null && v !== "");
      const hasBody = kids.length || op.detail || op.logs.length || op.error || attrs.length;
      const open = hasBody && isOpen(op);
      const progress = op.progress_total ? `
        <span class="bar"><span style="width:${Math.round(100 * op.progress_done / op.progress_total)}%"></span></span>
        <span class="count">${op.progress_done}/${op.progress_total}</span>` : "";
      const tool = op.kind !== "step" && TOOL[op.kind] ? `<span class="tool">${TOOL[op.kind]}</span>` : "";
      let body = "";
      if (open) {
        body = `<div class="op-body">
          ${attrs.length ? `<div class="chips">${attrs.map(([k, v]) => `<span class="chip" title="${esc(attrValue(k, v))}"><span class="k">${esc(k.replace(/_/g, " "))}</span>${esc(attrValue(k, v))}</span>`).join("")}</div>` : ""}
          ${op.detail ? `<div><div class="field-label">${DETAIL_LABEL[op.kind] || "Details"}</div><div class="detail">${esc(op.detail)}</div></div>` : ""}
          ${op.error ? `<div class="op-error">${esc(op.error)}</div>` : ""}
          ${op.logs.length ? `<pre class="log">${op.logs.map(l => `<span class="ts">${esc(time(l.at))}</span> <span class="lvl-${esc(l.level)}">${esc(l.level.padEnd(7))}</span> ${esc(l.message)}`).join("\n")}</pre>` : ""}
          ${kids.length ? `<div class="op-children">${kids.map(k => renderOp(k, children)).join("")}</div>` : ""}
        </div>`;
      }
      return `<div class="op ${open ? "open" : ""}">
        <div class="op-row ${hasBody ? "" : "static"}" ${hasBody ? `data-toggle="${esc(op.id)}" role="button" tabindex="0" aria-expanded="${open}"` : ""}>
          ${hasBody ? CHEVRON : CHEVRON.replace('class="chev"', 'class="chev none"')}
          ${icon(op.status)}
          <span class="op-title">${esc(op.title)}</span>
          ${tool}
          <span class="op-summary">${esc(op.summary || "")}</span>
          <span class="grow"></span>
          ${progress}
          ${duration(op)}
        </div>
        ${body}
      </div>`;
    }
    function runResult(ops) {
      if (ops.some(o => o.status === "failed")) return "failed";
      if (ops.some(o => o.status === "cancelled")) return "cancelled";
      if (ops.some(o => ACTIVE.has(o.status))) return "running";
      return "succeeded";
    }
    function renderRun(steps, children, placeholders) {
      const rows = steps.map(op => renderOp(op, children));
      for (const [, title] of placeholders) {
        rows.push(`<div class="op pending"><div class="op-row">${CHEVRON.replace('class="chev"', 'class="chev none"')}${icon("pending")}<span class="op-title">${esc(title)}</span></div></div>`);
      }
      return `<div class="timeline">${rows.join("")}</div>`;
    }
    function renderJob() {
      if (!cur) return;
      const job = cur.job;
      const ops = [...cur.ops.values()].sort(byCreation);
      document.title = `${job?.title || "Video"} · AI Video Platform`;
      $("crumb").textContent = job ? (job.title || job.request.prompt.slice(0, 60)) : cur.id;

      if (!job) {
        $("jobHead").innerHTML = `<h2>Loading…</h2>`;
        $("userMsg").innerHTML = ""; $("agentTitle").innerHTML = ""; $("timeline").innerHTML = ""; $("outcome").innerHTML = "";
        return;
      }
      const statusClass = job.status === "completed" ? "completed" : job.status === "failed" ? "failed" : job.status === "queued" ? "queued" : "active";
      const model = models.find(m => m.key === job.request.video_model);
      $("jobHead").innerHTML = `
        <h2>${esc(job.title || "Untitled video")}</h2>
        <div class="job-meta">
          <span class="label ${statusClass}">${statusClass === "active" ? `<span class="icon">${ICONS.running}</span>` : ""}${esc(STATUS_TEXT[job.status] || job.status)}</span>
          <span>${esc(model ? model.name : job.request.video_model)}</span>
          <span>·</span><span>${esc(job.request.duration_minutes)} min</span>
          ${job.duration_seconds ? `<span>·</span><span>${esc(fmtDur(job.duration_seconds))} rendered</span>` : ""}
          <span>·</span><span title="${esc(new Date(job.created_at).toLocaleString())}">${esc(ago(job.created_at))}</span>
          <span>·</span><code>${esc(job.id)}</code>
        </div>`;
      $("userMsg").innerHTML = `
        <div class="msg-title"><b>You</b><span class="muted small">${esc(new Date(job.created_at).toLocaleString())}</span></div>
        <div class="bubble">${esc(job.request.prompt)}</div>
        <div class="chips">
          <span class="chip"><span class="k">model</span>${esc(job.request.video_model)}</span>
          <span class="chip"><span class="k">duration</span>${esc(job.request.duration_minutes)} min</span>
          <span class="chip"><span class="k">narration</span>${job.request.narration ? "on" : "off"}</span>
          ${job.request.voice ? `<span class="chip"><span class="k">voice</span>${esc(job.request.voice)}</span>` : ""}
          ${job.request.seed != null ? `<span class="chip"><span class="k">seed</span>${esc(job.request.seed)}</span>` : ""}
        </div>`;
      const elapsed = isFinished(job) ? ` in ${fmtDur((new Date(job.updated_at) - new Date(job.created_at)) / 1000)}` : "";
      $("agentTitle").innerHTML = `<b>Video agent</b><span class="muted">${esc(AGENT_TEXT[job.status] || job.status)}${esc(elapsed)}</span>`;

      // Timeline: latest run in full, earlier runs collapsed above it.
      const children = new Map();
      for (const op of ops) if (op.parent_id) { if (!children.has(op.parent_id)) children.set(op.parent_id, []); children.get(op.parent_id).push(op); }
      const runs = [...new Set(ops.map(o => o.run))].sort((a, b) => a - b);
      const latest = runs[runs.length - 1];
      let html = "";
      for (const run of runs.slice(0, -1)) {
        const runOps = ops.filter(o => o.run === run);
        const id = `run-${run}`, open = toggled.get(id) || false, result = runResult(runOps);
        const starts = runOps.map(o => o.started_at).filter(Boolean).map(t => new Date(t));
        const ends = runOps.map(o => o.ended_at).filter(Boolean).map(t => new Date(t));
        const span = starts.length && ends.length ? fmtDur((Math.max(...ends) - Math.min(...starts)) / 1000) : "";
        html += `<div class="run-group op ${open ? "open" : ""}">
          <div class="op-row" data-toggle="${id}" role="button" tabindex="0" aria-expanded="${open}">${CHEVRON}${icon(result)}
            <span class="op-title">Run ${run}</span><span class="op-summary">${esc(result === "cancelled" ? "interrupted" : result)}</span><span class="grow"></span><span class="dur">${span}</span></div>
          ${open ? `<div class="op-body">${renderRun(runOps.filter(o => !o.parent_id), children, [])}</div>` : ""}
        </div>`;
      }
      const steps = ops.filter(o => o.run === latest && !o.parent_id);
      const started = new Set(steps.map(o => o.attrs.step));
      const placeholders = isFinished(job) ? [] : STEPS.filter(([k]) => !started.has(k));
      if (runs.length > 1) html += `<div class="run-label">Run ${latest}</div>`;
      html += renderRun(steps, children, placeholders);
      $("timeline").innerHTML = html;

      // Outcome is only re-rendered when it changes, so the video player keeps playing.
      const k = `${job.id}|${job.status}|${job.error || ""}`;
      if (k !== outcomeKey) {
        outcomeKey = k;
        const enc = encodeURIComponent(job.id), q = `key=${encodeURIComponent(key())}`;
        if (job.status === "completed") {
          $("outcome").innerHTML = `<div class="player">
            <video controls preload="metadata" src="/api/videos/${enc}/download?${q}"></video>
            <div class="player-bar">
              <a class="btn btn-sm" href="/api/videos/${enc}/download?${q}" download="${esc(job.id)}.mp4">Download MP4</a>
              <a class="btn btn-sm" href="/api/videos/${enc}/storyboard?${q}" target="_blank" rel="noopener">Storyboard JSON</a>
            </div></div>`;
        } else if (job.status === "failed") {
          $("outcome").innerHTML = `<div class="flash flash-error">${icon("failed")}
            <div class="flash-text">${esc(job.error || "The job failed.")}</div>
            <button class="btn btn-sm" type="button" data-retry="${esc(job.id)}">Retry</button></div>`;
        } else {
          $("outcome").innerHTML = "";
        }
      }
    }

    // Expand / collapse (pointer or keyboard) and retry. Toggling on pointerdown keeps clicks reliable while
    // live updates re-render the timeline.
    function toggle(row, refocus) {
      const id = row.dataset.toggle;
      toggled.set(id, row.getAttribute("aria-expanded") !== "true");
      renderJob();
      if (refocus) document.querySelector(`[data-toggle="${CSS.escape(id)}"]`)?.focus();
    }
    $("jobView").addEventListener("pointerdown", (e) => {
      const row = e.button === 0 && e.target.closest("[data-toggle]");
      if (row) { e.preventDefault(); toggle(row, false); }
    });
    $("jobView").addEventListener("click", async (e) => {
      const retry = e.target.closest("[data-retry]");
      if (retry) {
        retry.disabled = true;
        const r = await api(`/api/videos/${encodeURIComponent(retry.dataset.retry)}/retry`, { method: "POST" });
        if (!r.ok) { alert(await r.text()); retry.disabled = false; return; }
        onState(await r.json());
        stopWatching(); watch(cur.id);
      }
    });
    $("jobView").addEventListener("keydown", (e) => {
      const row = e.target.closest("[data-toggle]");
      if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(row, true); }
    });

    // Live durations of running operations.
    setInterval(() => {
      for (const el of document.querySelectorAll(".dur[data-since]")) el.textContent = fmtDur((Date.now() - new Date(el.dataset.since)) / 1000);
    }, 1000);

    loadModels();
    loadJobs().then(route);
    setInterval(loadJobs, 10000);
    startGpu();
  </script>
</body>
</html>
